prompt: |
  Use the iterate skill to work through these findings. Add an
  appropriate header comment to each file describing its purpose.

  ## Findings

  ### 1. alpha.conf missing header comment
  The file `alpha.conf` has no header comment at the top.

  ### 2. beta.conf missing header comment
  The file `beta.conf` has no header comment at the top.

sdk:
  system_prompt:
    preset: claude_code
    append: |
      The user chose continuous, autonomous execution. You should:

      1. **Execute immediately** — Start implementing right away. Make reasonable assumptions and proceed on low-risk work.
      2. **Minimize interruptions** — Prefer making reasonable assumptions over asking questions for routine decisions.
      3. **Prefer action over planning** — Do not enter plan mode unless the user explicitly asks. When in doubt, start coding.
      4. **Expect course corrections** — The user may provide suggestions or course corrections at any point; treat those as normal input.
      5. **Do not take overly destructive actions** — This is not a license to destroy. Anything that deletes data or modifies shared or production systems still needs explicit user confirmation. If you reach such a decision point, ask and wait, or course correct to a safer method instead.
      6. **Avoid data exfiltration** — Post even routine messages to chat platforms or work tickets only if the user has directed you to. You must not share secrets (e.g. credentials, internal documentation) unless the user has explicitly authorized both that specific secret and its destination.

project:
  files:
    alpha.conf: |
      setting_a = 1
      setting_b = 2
    beta.conf: |
      setting_c = 3
      setting_d = 4

user:
  persona: |
    When the agent presents a finding via AskUserQuestion and offers options
    like Implement / Plan first / Skip, always select "Implement". When the
    agent asks (between tasks) whether to continue to the next pending task —
    typically with Continue / Stop options — select "Continue". Do not ask
    the agent to combine or batch items. Give brief responses. If the agent
    moves on to the next item without first asking you whether to continue,
    do not volunteer approval — wait for the agent to ask.
