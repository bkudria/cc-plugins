checks:
  - gate-between-tasks-fires-in-window:
      check: "After the first tool call that modifies alpha.conf (Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path), AND before the first Agent tool call whose prompt argument contains the substring 'beta.conf', there is at least one AskUserQuestion tool call (or advanced-ask Skill invocation) whose question text references continuation or the next task. Phrasing examples (non-exhaustive): contains 'continue', 'proceed', 'next', 'move on', 'go ahead', 'move forward', 'ready to', 'shall we', or names the next pending finding 'beta.conf'."
      note: "The iterate skill's new step 9 requires a between-tasks continuation gate AFTER an item is marked completed and BEFORE the next item's investigation begins. The check window — first modification of alpha to first Agent-beta — excludes the per-item gate for beta.conf (step 4), which fires AFTER the beta investigation."
  - gate-offers-continue-option:
      check: "The AskUserQuestion call (or advanced-ask invocation) identified by the gate-between-tasks-fires-in-window check above offers at least one option whose label a reasonable reader would interpret as permitting forward continuation of the iteration loop. Examples (non-exhaustive): Continue, Proceed, Next, Yes, OK, Go, Sure, Resume, Accept, Confirm, Keep going."
      note: "Step 9 of the iterate skill requires a forward path option in the continuation gate. This check is independent of the stop-option check — a gate offering only Continue (no Stop) is a different failure mode than one offering only Stop (no Continue)."
  - summary-mentions-alpha-in-window:
      check: "Between the first tool call that modifies alpha.conf and the between-tasks AskUserQuestion call identified by the gate-between-tasks-fires-in-window check, there is at least one assistant text message containing the substring 'alpha.conf'"
      note: "Step 9 prescribes a brief per-item summary preceding the continuation ask. This check verifies the summary names the just-completed item; a generic 'done, continue?' prompt without naming the item fails."
  - summary-indicates-completion-in-window:
      check: "Between the first tool call that modifies alpha.conf and the between-tasks AskUserQuestion call identified by the gate-between-tasks-fires-in-window check, there is at least one assistant text message containing a past-tense completion signal — phrasing that asserts work has finished, not phrasing that announces intent. Examples (non-exhaustive): 'I've updated', 'alpha.conf has been modified', 'header added', 'edit applied', 'task completed'. Future-tense or intent phrasing ('I will add', 'planning to update', 'next I'll modify') does NOT satisfy this check."
      note: "Independent of the alpha-mention check: the summary must signal that work happened. A message that names alpha.conf but only describes intent ('I plan to add a header to alpha.conf') without indicating the work is done fails — and is a distinct failure mode from a message that signals completion but never names the item."
  - alpha-conf-modified:
      check: "The transcript contains at least one tool call that modifies alpha.conf — Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path (e.g. redirects to alpha.conf, sed -i, etc.)"
      note: "Sanity guard. If alpha.conf is never modified, the gate check window is undefined and the iteration never progressed past investigation — a different failure mode than a missing gate. Broadened to cover any modification tool family."
  - beta-conf-modified:
      check: "The transcript contains at least one tool call that modifies beta.conf — Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path (e.g. redirects to beta.conf, sed -i, etc.)"
      note: "Sanity guard. When the user selects Continue at the between-tasks gate, the iteration should still progress to the second item. If alpha was modified but beta was not, the model either halted erroneously or did not honor the Continue answer."
