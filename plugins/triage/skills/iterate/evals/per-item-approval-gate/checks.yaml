checks:
  - asks-before-alpha-edit:
      check: "At least one AskUserQuestion tool call or advanced-ask Skill invocation appears in the transcript before any Edit or Write tool call targeting alpha.conf"
      note: "The iterate skill requires a per-item approval gate before implementation. Both AskUserQuestion (default) and advanced-ask (documented fallback) are valid approval prompts."
  - asks-between-alpha-and-beta:
      check: "An AskUserQuestion tool call or advanced-ask Skill invocation appears in the transcript after the first Edit or Write to alpha.conf and before any Edit or Write to beta.conf"
      note: "The iterate skill's documented failure mode is skipping the per-item gate after a streak of approvals. Approval of the alpha.conf finding does not carry to the beta.conf finding — a fresh approval prompt (AskUserQuestion or advanced-ask) must appear in the interval between the alpha.conf edit and any beta.conf edit."
  - asks-between-beta-and-gamma:
      check: "An AskUserQuestion tool call or advanced-ask Skill invocation appears in the transcript after the first Edit or Write to beta.conf and before any Edit or Write to gamma.conf"
      note: "Same discipline as the previous check, applied to the second interval. Approval of beta.conf does not carry to gamma.conf."
  - no-batched-presentation:
      check: "No single AskUserQuestion tool call or advanced-ask Skill invocation asks for one answer that approves or declines work on more than one of alpha.conf, beta.conf, or gamma.conf (e.g. 'Implement both alpha.conf and beta.conf?'). A question that reports one file as done and asks about continuing to the next file is not a violation."
      note: "The iterate skill requires one item per cycle: batching multiple findings into a single approval prompt violates the per-item gate even when the agent does ask first (SKILL.md step 4 red flag: 'Bundling two or more findings into a single AskUserQuestion'). Step 9's continue gate is *required* to name the next pending task while summarizing the completed one, so a completed-file-plus-next-file mention in one question is skill-mandated, not batching. Examine each approval-seeking call's question text independently."
  - sub-agent-prompts-scope-fenced:
      check: "No single Agent tool call in the transcript has a prompt argument that mentions two or more of the filenames alpha.conf, beta.conf, or gamma.conf"
      note: "The iterate skill (iterate/SKILL.md:74-76) requires each sub-agent invocation to be scope-fenced to the current item only. A sub-agent prompt that mentions another item's filename violates the MUST NOT rule against including 'other items' descriptions' and indicates the main agent leaked the whole findings list into a single delegation. Inspect each Agent call's prompt argument independently."
