checks:
  - presentation-leads-with-finding:
      check: "In the agent's message content before the first AskUserQuestion tool call, the source-list finding (the 'hardcoded timeout' problem framing — i.e., that there is a hardcoded 30-second timeout that should be configurable) is stated FIRST as a finding/problem to be addressed, BEFORE any concrete investigation results from the sub-agent (file paths like 'src/myapp/config.py', the function name 'load_config', or the value '30'). The finding/problem framing must precede the investigation results in the presentation text — leading with code citations or file paths and only later acknowledging the source-list framing does NOT satisfy this check."
      note: "Phase 1 step 3 of the iterate skill mandates a two-part presentation: first re-state the finding/problem from the source list, then report what the investigation found. This ordering ensures the user sees 'what we're deciding' before 'what the codebase looks like'. A presentation that leads with file paths or code details and treats the finding as an afterthought collapses the structure and forces the user to back-derive the decision."
  - presentation-contains-both-parts:
      check: "Before the first AskUserQuestion tool call, the agent's message content contains BOTH (a) a re-statement of the source-list finding/problem (the hardcoded 30-second timeout being configurable), AND (b) at least one concrete investigation artifact discovered from the project files (the path 'src/myapp/config.py', the function name 'load_config', or the literal value '30')."
      note: "Sanity check: the ordering assertion is only meaningful if both parts are actually present. This check ensures the presentation isn't missing one half (e.g., skipping the finding restatement entirely and only showing code, or skipping investigation entirely)."
