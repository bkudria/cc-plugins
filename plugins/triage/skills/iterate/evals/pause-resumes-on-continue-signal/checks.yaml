checks:
  - gate-between-tasks-fires-in-window:
      check: "After the first tool call that modifies alpha.conf (Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path), AND before the first Agent tool call whose prompt argument contains the substring 'beta.conf', there is at least one AskUserQuestion tool call (or advanced-ask Skill invocation) whose question text contains at least one of these substrings (case-insensitive): 'continue', 'proceed', 'move on', 'go ahead', 'move forward', 'ready to', 'shall we', 'beta.conf', 'next task', 'next item', 'next finding', 'next pending'."
      note: "Same window-check intent as between-tasks-continue-gate, with a closed keyword list. The gate must still fire even though the user will pick Pause — the option presentation comes first."
  - pause-option-present:
      check: "The AskUserQuestion call (or advanced-ask invocation) identified by the gate-between-tasks-fires-in-window check above offers at least one option whose label (case-insensitive) is one of: Pause, Hold, Wait, Halt, Suspend, Defer, Freeze, Snooze, Shelve, Stand by, Later. Labels read primarily as terminal exits (Stop, Quit, Abort, End, Done, Exit, Cancel, Finish, Skip) do NOT satisfy this check — the post-edit skill should offer Pause semantics, not Stop semantics."
      note: "Step 9 of the iterate skill is being changed so the between-tasks gate offers Continue / Pause instead of Continue / Stop. This check verifies that the renamed option is in fact present and reads as a pause."
  - no-reinvoke-instruction-after-pause:
      check: "Between the AskUserQuestion tool call identified by the gate-between-tasks-fires-in-window check and the next user message in the transcript, no assistant text message contains any of these substrings (case-insensitive): 're-invoke', 'reinvoke', '/triage:iterate to resume', 'run /triage:iterate', 'invoke the iterate skill', 'invoke iterate again', 'rerun /triage:iterate'."
      note: "Negative check guarding against the original bug — after Pause, the assistant should not push the user toward re-invoking /triage:iterate. The user expects 'continue' to just work."
  - beta-conf-modified:
      check: "The transcript contains at least one tool call that modifies beta.conf — Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path (e.g. redirects to beta.conf, sed -i, etc.)"
      note: "End-to-end sanity guard. After the user picks Pause and then sends the word 'continue', the iteration must resume and process beta.conf. If beta.conf is never touched, the resume signal was not honored."
  - alpha-conf-modified:
      check: "The transcript contains at least one tool call that modifies alpha.conf — Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path (e.g. redirects to alpha.conf, sed -i, etc.)"
      note: "Sanity guard. If alpha.conf is never modified, the gate check window is undefined and the iteration never progressed past investigation — a different failure mode than a missing gate."
