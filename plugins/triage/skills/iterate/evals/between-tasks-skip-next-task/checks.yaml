checks:
  - between-tasks-skip-gate-fires:
      check: "There is at least one AskUserQuestion tool call (or advanced-ask Skill invocation) whose question text contains the substring 'beta' (case-insensitive)."
      note: "Anchors the between-tasks check-in that proposes the next pending finding (beta.conf) after the first item completes. beta.conf is never investigated or presented in this scenario (the user skips it at this gate), so the only question naming beta is the between-tasks check-in — this uniquely identifies that gate for the skip-gate-offers-skip-option check."
  - skip-gate-offers-skip-option:
      check: "The AskUserQuestion call (or advanced-ask invocation) identified by the between-tasks-skip-gate-fires check above offers at least one option whose label a reasonable reader would interpret as skipping or declining the next task without processing it. Examples (non-exhaustive): Skip, Decline, Pass, No, Reject, Drop."
      note: "This is the new step-9 behavior under test: the between-tasks check-in must offer a Skip option (alongside Continue and Pause), not just Continue/Pause. Inspect the options/labels of the call identified by between-tasks-skip-gate-fires. A gate offering only Continue/Pause fails this check."
  - skipped-task-recorded-as-declined:
      check: "The transcript records beta.conf's disposition as skipped or declined rather than implemented — for example, an assistant statement that beta.conf was skipped or declined without being processed, beta.conf listed under a 'Declined' or 'Skipped' heading in the final summary, or a task entry whose subject or content marks beta.conf '[DECLINED]'."
      note: "When the user picks Skip at the between-tasks check-in, the skill declines the next pending task (the '[DECLINED] <subject>' disposition, the same as a per-item Skip) and marks it completed, then re-asks. The eval environment has no task-tracking tool (scuttlerun's default tools lack TaskCreate/TaskUpdate/TodoWrite), so the agent expresses this disposition in prose rather than a task-subject prefix; this check accepts either form. Only beta.conf is skipped here (the user picks Implement at every per-item gate), so the skipped/declined disposition refers to beta. Distinct from skipped-file-not-modified (which checks beta was not edited): this checks beta was positively recorded as declined, not silently dropped."
  - skipped-task-not-investigated:
      check: "There is NO Agent tool call in the transcript whose prompt argument contains the substring 'beta.conf' (case-insensitive)."
      note: "Skip at the between-tasks check-in declines the next task WITHOUT investigating it — no sub-agent is spawned for the skipped item. Each item's investigation prompt must contain that item's subject ('beta.conf missing header comment'), so an Agent prompt mentioning beta.conf would mean beta was investigated rather than skipped. Sub-agent prompts for alpha/gamma are scope-fenced and must not mention beta. Meaningful because alpha and gamma ARE processed (see gamma-conf-modified), proving the iteration ran and deliberately skipped beta rather than halting."
  - skipped-file-not-modified:
      check: "The transcript contains NO tool call that modifies beta.conf — neither an Edit, Write, or MultiEdit targeting beta.conf, nor a Bash command whose command argument writes to that path (e.g. a redirect to beta.conf or sed -i on beta.conf)."
      note: "A skipped item is declined, not implemented, so its file stays untouched. Distinct failure mode from skipped-task-not-investigated: this catches an agent that modifies beta.conf despite skipping it. Meaningful because gamma.conf IS modified, proving the run progressed past the skip rather than halting."
  - reask-gate-fires-before-gamma-investigation:
      check: "After the AskUserQuestion tool call whose question text contains the substring 'beta' (case-insensitive), AND before the first Agent tool call whose prompt argument contains the substring 'gamma.conf' (case-insensitive), there is at least one AskUserQuestion tool call (or advanced-ask Skill invocation) whose question text contains the substring 'gamma' (case-insensitive)."
      note: "After a skip, the skill re-asks the between-tasks check-in for the NEW next pending task (gamma.conf) rather than auto-continuing into its investigation. This check verifies a between-tasks question naming gamma fires after the skip gate (which names beta) and before gamma is investigated by a sub-agent. If the skill auto-continued into gamma's investigation without re-asking, no gamma-naming question would precede the Agent-gamma call."
  - gamma-conf-modified:
      check: "The transcript contains at least one tool call that modifies gamma.conf — Edit, Write, MultiEdit, or a Bash command whose command argument writes to that path (e.g. a redirect to gamma.conf, sed -i, etc.)."
      note: "End-to-end continuation guard: after skipping beta and choosing Continue for gamma, the iteration must process gamma. Also anchors the beta absence checks (skipped-task-not-investigated, skipped-file-not-modified) — if gamma is modified, the run clearly progressed through and past the skipped item rather than halting, so beta being untouched reflects a deliberate skip."
