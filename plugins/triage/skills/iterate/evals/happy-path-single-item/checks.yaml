checks:
  - investigates-notes-before-ask:
      check: "At least one Agent tool call whose prompt argument contains the substring 'notes.md' appears in the transcript before the first AskUserQuestion tool call or advanced-ask Skill invocation"
      note: "The iterate skill mandates sub-agent delegation for per-item investigation (iterate/SKILL.md:72-78). The delegated sub-agent's prompt must reference notes.md so the investigation is scope-fenced to the specific finding."
  - no-edit-before-ask:
      check: "No Edit or Write tool call targeting notes.md appears in the transcript before the first AskUserQuestion tool call or advanced-ask Skill invocation"
      note: "The iterate skill requires the approval gate to precede implementation. An edit before any approval prompt violates the gate, even in a single-item iteration."
  - notes-md-modified:
      check: "The transcript contains at least one Edit, Write, or MultiEdit tool call targeting notes.md (or a Bash command whose command argument writes to that path, e.g. a redirect to notes.md or sed -i)"
      note: "Sanity guard that the single item is actually processed — an edit to notes.md lands (paired with no-edit-before-ask, which constrains it to after the approval gate). Presence-only rather than asserting the heading content because scuttlerun's transcript drops Write/Edit content (content/old_string/new_string) by design (scuttlerun.allium TranscriptToolFieldContract); a content-level assertion forces the grader to infer the written text from prose and is flaky run-to-run."
