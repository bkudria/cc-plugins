checks:
  - delegates-investigation-to-sub-agent:
      check: "At least one Agent tool call appears in the transcript before the first AskUserQuestion tool call or advanced-ask Skill invocation"
      note: "The iterate skill mandates that per-item investigation MUST happen via the Agent tool, with no exceptions for items that look obvious. This scenario's prompt deliberately suggests 'they look pretty obvious — process them quickly please' to test that the agent does not skip sub-agent delegation under perceived simplicity pressure. The check fails if the agent investigates via direct Read/Grep/Glob/Bash calls instead of delegating."
  - investigates-first-item-via-sub-agent:
      check: "At least one Agent tool call whose prompt argument contains the substring 'csv_to_kdl' appears in the transcript before the first AskUserQuestion tool call or advanced-ask Skill invocation"
      note: "Per-item investigation for the first finding (the missing docstring on main()) must be performed by a sub-agent before the user is prompted. The sub-agent's prompt must reference the project-specific path/package 'csv_to_kdl' so the investigation is scope-fenced and substantive. Direct Read/Grep/Glob/Bash investigation by the main agent does not satisfy the skill's mandate (verification reads after the sub-agent returns are allowed, but the initial investigation is not)."
  - investigates-second-item-via-sub-agent:
      check: "At least one Agent tool call whose prompt argument references the second finding's output/logging concern (e.g. contains 'print', 'logger', or 'logging') appears in the transcript after the first AskUserQuestion tool call or advanced-ask Skill invocation"
      note: "Each finding gets its own fresh sub-agent invocation. The second finding (cli.py uses print() instead of a logger) must be investigated from scratch by a new Agent call after the first item's approval prompt — reusing the prior sub-agent's findings or investigating directly with Read/Grep/Glob/Bash violates the per-item scope rule. The skill emits two AskUserQuestion calls per item (the approval gate and the end-of-item Continue/Skip/Pause check-in), so the second finding's sub-agent legitimately runs after the check-in; anchoring on 'after the first approval prompt' plus the print/logging content of the second finding identifies that fresh investigation without miscounting the check-in as the second prompt."
  - presentation-references-concrete-evidence:
      check: "At least one of the following concrete project details appears in the agent's message content or in the question text of an AskUserQuestion tool call before or during the first approval prompt: the function signature 'def main()' or 'main()' with parentheses, the literal token 'argparse' or 'ArgumentParser', or the filename 'src/csv_to_kdl/cli.py' (full path, not just 'cli.py')"
      note: "The iterate skill's artifact rule states: 'The presentation must reference specific findings from this investigation — file paths, current values, concrete state discovered.' A presentation that restates the finding title without citing project-specific details discovered during investigation means the investigation was skipped or its results were not used. The prompt deliberately withholds project context and the user persona refuses to volunteer it — the agent must discover and cite these details from cli.py."
