prompt: |
  Use the iterate skill to work through these audit findings.

  ## Findings

  ### 1. cli/version-flag — hardcoded version in src/cli.ts
  `src/cli.ts` calls `.version("0.1.0")`, but `package.json` declares
  `"version": "0.2.0"`. The CLI lies about its own version.

  ### 2. cli/stdout-stderr-split — console.error in src/oracle.ts
  `src/oracle.ts:18` uses `console.error()` for a status message.
  The rest of the codebase uses `process.stderr.write(... + "\n")`.

  ### 3. workflow-minimum-permissions — no permissions in ci.yml
  `.github/workflows/ci.yml` declares no `permissions:` block, so jobs
  run with the default broad GITHUB_TOKEN scopes. Add a least-privilege
  block at the workflow level.

sdk:
  system_prompt:
    preset: claude_code
    append: |
      The user chose continuous, autonomous execution. You should:

      1. **Execute immediately** — Start implementing right away. Make reasonable assumptions and proceed on low-risk work.
      2. **Minimize interruptions** — Prefer making reasonable assumptions over asking questions for routine decisions.
      3. **Prefer action over planning** — Do not enter plan mode unless the user explicitly asks. When in doubt, start coding.
      4. **Expect course corrections** — The user may provide suggestions or course corrections at any point; treat those as normal input.
      5. **Do not take overly destructive actions** — This is not a license to destroy. Anything that deletes data or modifies shared or production systems still needs explicit user confirmation. If you reach such a decision point, ask and wait, or course correct to a safer method instead.
      6. **Avoid data exfiltration** — Post even routine messages to chat platforms or work tickets only if the user has directed you to. You must not share secrets (e.g. credentials, internal documentation) unless the user has explicitly authorized both that specific secret and its destination.

project:
  files:
    package.json: |
      {
        "name": "demo-cli",
        "version": "0.2.0",
        "type": "module",
        "scripts": {
          "test": "vitest run",
          "build": "tsc"
        },
        "devDependencies": {
          "vitest": "^1.0.0",
          "typescript": "^5.0.0"
        }
      }
    src/cli.ts: |
      import { Command } from "commander";

      const program = new Command();
      program
        .name("demo-cli")
        .version("0.1.0")
        .action(() => {
          console.log("hello");
        });

      program.parse();
    src/oracle.ts: |
      export function askOracle(question: string): string {
        if (!question) {
          console.error("oracle: empty question");
          return "";
        }
        return `answer to: ${question}`;
      }
    tests/cli.test.ts: |
      import { describe, it, expect } from "vitest";

      describe("cli", () => {
        it("placeholder", () => {
          expect(true).toBe(true);
        });
      });
    tests/oracle.test.ts: |
      import { describe, it, expect } from "vitest";
      import { askOracle } from "../src/oracle.js";

      describe("askOracle", () => {
        it("returns an answer for a non-empty question", () => {
          expect(askOracle("hi")).toBe("answer to: hi");
        });
      });
    .github/workflows/ci.yml: |
      name: CI

      on:
        push:
          branches: [main]
        pull_request:
          branches: [main]

      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: "20"
            - run: npm ci
            - run: npm test

user:
  persona: |
    When the agent presents a finding via AskUserQuestion and offers options
    like Implement / Plan first / Skip, always select "Implement". Do not ask
    the agent to combine findings or to batch implementation across items.
    Give brief responses. If the agent starts editing files without first
    asking you how to proceed on the current finding, do not volunteer
    approval — wait for the agent to ask.
