checks:
  - produces-numbered-h3-findings:
      check: "The presented assessment contains at least two level-3 markdown headings whose text begins with a number followed by a period and a space (e.g., `### 1. ` and `### 2. `)."
      note: "investigate.js mandates findings as `### N. Title` h3 subsections under a `## Findings` section (the synthesize stage's OUTPUT FORMAT block). The `### N.` shape is the workflow's output contract, so an equivalent enumeration style would be a format violation, not an alternative. Look at the file the agent read and presented."
  - findings-stay-observation-only:
      check: "No paragraph under a `### N.` finding heading in the presented assessment directs the reader toward an action or change. Triggers: imperatives aimed at the reader ('Use X', 'Fix Y', 'Replace Z', 'Migrate to Y', 'Switch to Z', 'Avoid X', 'Ensure X'), modal verbs of obligation ('should', 'must', 'ought to'), recommendation frames ('Recommend:', 'Solution:', 'To resolve:', 'Consider X'), and 'could'/'would' only when they direct the reader toward an action ('could switch to parameterized queries', 'would recommend rotating the key'). Modals describing code behavior or consequences are NOT triggers — 'the unparameterized query could expose the database to injection' and 'the lock ordering would create a deadlock' both pass, because they describe what the code does, not what the reader should do."
      note: "investigate.js's synthesize stage forbids prescription in finding bodies — findings describe what IS, not what SHOULD BE. 'The get_user function builds SQL with an f-string' passes; 'should use parameterized queries' fails. The discipline targets reader-directed prescription, so descriptive conditional modals (could/would about code behavior) are acceptable. A vanilla assessment would normally include recommendations, so this targets the workflow's specific discipline."
  - no-remediation-section:
      check: "The presented assessment contains no level-2 section heading (`## `) whose text is prescriptive or imperative about what should be changed or done — for example 'Recommendations', 'Fixes', 'Solutions', 'Next Steps', 'Action Items', 'Remediation', 'Suggestions', or 'Mitigations'. Headings that merely describe the assessment itself (such as '## Findings', '## Summary', '## Assessment') are not prescriptive."
      note: "investigate.js's output template has exactly three h2 sections: '## Assessment: ...', '## Findings', and '## Summary'. Any additional action-framed h2 means the observation-only discipline broke down by structurally separating prescriptions from observations."
  - findings-cite-identifier-and-location:
      check: "The presented assessment contains at least one phrase that pairs a concrete fixture identifier with its specific source location — e.g., 'the password `admin123` in `src/config.py`', 'the SQL f-string in the `get_user` function of `src/db.py`', or 'the broken link to `docs/architecture.md` in `README.md`'."
      note: "investigate.js requires finding bodies to state where (paths/lines/values). A paired identifier-plus-location citation confirms the workflow grounded findings in the actual fixture rather than producing generic prose — pairs are hard to fabricate because the identifier must match the file it appears in."
