checks:
  - asks-effort-level-in-interview:
      check: "The transcript contains an AskUserQuestion tool call (or an advanced-ask Skill invocation) whose question presents an investigation effort or depth choice to the user — for example offering low / medium / high levels or asking how much effort to spend on the investigation."
      note: "Presence anchor for effort-presentation-names-a-dropped-stage. The prompt supplies no scope, so Phase 0 falls through to the Phase 1 scope interview, which offers effort as an optional level via AskUserQuestion. This anchors that the effort question was actually asked; it passes both before and after the documentation edit and does not itself test the new disclosure."
  - effort-presentation-names-a-dropped-stage:
      check: "When the agent presents the effort choice during the interview — in the AskUserQuestion question text or its effort option descriptions — it discloses that the effort level determines whether a specific qualitative investigation stage runs: for example that lower effort skips, or higher effort adds, at least one concrete stage such as completeness/gap checking, adversarial or cross-verification of findings, citation/source grounding, or plan critique. A presentation that describes effort only in the abstract — as compute, cost, time, speed, depth, or thoroughness — without naming a specific stage tied to the effort level does NOT satisfy this check."
      note: "Finding under test: SKILL.md Phase 1 must disclose that effort gates investigative rigor (at low effort the completeness loop, adversarial verification, grounding, and plan critique are all skipped) rather than framing effort as a pure cost/ceiling dial. AskUserQuestion inputs are observable in the transcript. This is the discriminating check: it fails against the current cost-only copy and passes once the Phase 1 effort bullet names the stages effort gates."
