prompt: |
  /assess Take a thorough look at config/auth.yaml and how this service's authentication is actually set up — the session handling, the anonymous-access and SSL posture, the overall shape of the configuration. What I really care about is whether credentials and secrets are handled safely; I'm not interested in schema nitpicks or formatting style.

project:
  files:
    config/auth.yaml: |
      auth:
        secret: "changeme"
        session_timeout_seconds: 999999
        allow_anonymous: true
        require_ssl: false

user:
  persona: |
    You requested an assessment of config/auth.yaml, focused specifically on
    credential and secret-handling weaknesses (not schema or formatting style).
    The investigation runs as a background workflow that takes a few minutes.
    Each time the agent reports it has started the investigation and is still
    waiting for it to finish, stay patient: reply briefly, e.g. "No rush, I'll
    wait for the results." Do NOT end the conversation while it is still
    waiting, and do NOT ask it to do the analysis a different way. Only once the
    agent has actually presented the completed numbered assessment is the task
    done. Do not volunteer extra context; answer any direct question briefly.
