checks:
  - dispatches-by-plugin-name:
      check: "The transcript contains a Workflow tool call whose `name` argument is `triage:assess-investigate`."
      note: "Phase 2 dispatches the investigation as the triage plugin's saved workflow, by name, because Workflow refuses a scriptPath outside the session's directories — the failure this skill shipped with when it called the script by path. In this eval the skill is installed as a project skill, so the name is not registered and the call fails; that is expected, and the fallback check covers what happens next. A vanilla agent has no knowledge of this workflow name."
  - falls-back-to-script-path:
      check: "The transcript contains a Workflow tool call whose `scriptPath` argument ends in `investigate.js`."
      note: "Paired with dispatches-by-plugin-name. This eval installs the skill outside a plugin, so the named workflow is not found and Phase 2's fallback must dispatch the same script by path for the investigation to run at all. A vanilla agent has no such script."
  - no-direct-fixture-investigation:
      check: "The transcript contains no file-reading or search tool call made by the agent (Read, Grep, Glob, or a Bash command such as cat/head/grep) that targets the fixture file config/auth.yaml or any other source file inside the working-directory project. Reading the /tmp/assessment-*.md artifact does not count."
      note: "The skill delegates investigation to the workflow; the main agent must not investigate the scope itself. The workflow's own sub-agent reads happen in separate journals and never appear in this transcript, so the only legitimate file read here is the /tmp assessment artifact. A vanilla agent asked to assess config/auth.yaml would read it directly — such a read means the agent investigated inline instead of delegating, which is the self-investigation/fabrication failure mode this skill fixes."
  - reads-workflow-artifact:
      check: "The transcript contains a file-reading tool call (e.g., Read, or a Bash command such as cat or head) whose target is a file located directly under /tmp/ with a filename beginning with `assessment-` and ending with `.md`."
      note: "Phase 3 retrieves the complete assessment from the canonical file the workflow wrote at /tmp/assessment-${CLAUDE_SESSION_ID}.md (the completion notification truncates large output). The agent can only read this file if the workflow actually ran and wrote it, so this read is the anchor that distinguishes a real result from a fabricated one. Any file-reading mechanism against that path satisfies the intent."
  - presents-findings-inline:
      check: "The agent's final message or messages contain at least two findings reproduced inline, each identified by sequential enumeration (e.g., `1.`, `1)`, `Finding 1:`, or a numbered markdown heading such as `### 1.`)."
      note: "Phase 3 presents the full findings inline, not merely a one-line count or a pointer to the file. Two or more enumerated findings confirm the agent output the workflow's assessment content rather than just announcing completion. Any standard sequential-enumeration style counts."
  - states-saved-path:
      check: "The assistant message that presents the enumerated findings inline states that the assessment was saved to a file path under /tmp/ whose name begins with `assessment-` (for example, `/tmp/assessment-<session-id>.md`)."
      note: "Phase 3 instructs the agent to state where the assessment was saved, as part of the presentation. This is the persistence signal — the agent reports the canonical /tmp path the workflow wrote. Anchored to the presentation message rather than the literal final message: a late async event (e.g. a stale background task completing) can append a short administrative reply after the presentation, and that trailing note neither satisfies nor violates this requirement."
  - points-at-iterate:
      check: "The assistant message that presents the enumerated findings inline contains the literal string `/triage:iterate`."
      note: "Phase 3 ends the presentation with the handoff: 'run `/triage:iterate` to process findings.' The literal namespaced command is the handoff signal to the downstream iterate skill and must accompany the findings presentation itself. Anchored to the presentation message rather than the literal final message: a late async event can append a short administrative reply after the presentation, and that trailing note neither satisfies nor violates the handoff."
  - forwards-embedded-focus-to-param:
      check: "At least one Workflow tool call includes a `focus` argument whose value expresses the credential- and secret-handling focus from the request — for example mentioning credentials, secrets, or the exclusion of schema/formatting concerns."
      note: "The request combines a scope (config/auth.yaml) with an embedded focus directive in one argument string. Phase 0/2 must route that directive to the first-class `focus` argument of the Workflow call rather than fold it into `scope` and omit `focus` (which makes the workflow fall back to its generic default focus). The Workflow tool-call input is observable in the transcript — inspect args.focus on either Workflow call (named or path fallback), not the scope text or the presented findings."
