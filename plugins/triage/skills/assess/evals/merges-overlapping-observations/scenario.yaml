prompt: |
  Use the assess skill to investigate this Python service. Report what is noteworthy.

project:
  files:
    README.md: |
      # Simple Service

      A small Python service.

      ## Setup
      pip install -r requirements.txt
    src/auth.py: |
      # Auth module
      API_KEY = "live-key-abc123"

      def authenticate(token):
          return token == API_KEY
    src/db.py: |
      # Database connection
      DB_PASSWORD = "prod-pass-xyz"

      def connect():
          return f"postgres://admin:{DB_PASSWORD}@db.example.com"
    src/cache.py: |
      # Cache connection
      REDIS_PASSWORD = "cache-secret-789"

      def connect():
          return f"redis://:{REDIS_PASSWORD}@cache.example.com"

user:
