version: "1"
min_pass_rate: 1.0
repeats: 1

# This skill delegates its investigation to a background Workflow
# (workflows/investigate.js). Exercising it end-to-end therefore runs the real
# workflow: ~$2-6 and ~6-12 min per run on claude-sonnet-5. The base config below carries everything
# the delegation needs — the Workflow tool, a generous timeout/budget, and
# sandbox disabled (matches the verified manual probe; the agent reads the
# ephemeral project dir and the workflow writes to /tmp). The workflow's
# DETERMINISTIC core — the assess<->iterate markdown format contract, the verdict
# rails, status/coverage derivation, and overall-question selection — is unit-tested
# directly in workflows/test/ (run: node --test workflows/test/*.test.mjs), not here.
# Its LLM-BEHAVIORAL facets (observation-only discipline, source-grounding) have no
# unit coverage and are exercised only at this skill/eval layer. This suite locks
# only the skill's own contract: delegate -> wait -> present, no fabrication.
scenarios:
  base:
    model: claude-sonnet-5
    additional_tools:
      - Agent
      - Workflow
    # The investigation workflow has grown (completeness critic, adversarial
    # verify, post-synthesis grounding); a medium-effort run on a multi-issue
    # fixture now writes its assessment around the 500s mark before the
    # grounding pass, so the earlier 600s wall is no longer generous. Give the
    # background workflow real headroom while still guarding against a hang.
    timeout: 1200
    # claude-sonnet-5 runs the investigation workflow harder than sonnet-4-5
    # did — worst observed session ≈ $5.6 agent-side; three of five scenarios
    # blew the old $4 cap. $10 restores headroom while still bounding a
    # runaway session.
    max_budget_usd: 10.0
    sandbox:
      enabled: false
    project:
      skills:
        - .
    user:
      oracle_model: claude-haiku-4-5
      max_turns: 15
