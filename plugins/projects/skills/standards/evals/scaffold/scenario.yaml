prompt: |
  I want to set up a new TypeScript CLI project called widgetmaker — a
  command-line tool for managing dashboard widgets. Set it up with project
  standards.

# This scenario's persona selects base+cli = 43 standards (37 prompt-based),
# and workflows/scaffold.md turns that into ~43 file creations plus a full
# two-round audit fanning out one haiku verifier per standard. That workload
# does not fit the suite defaults: recorded reps crashed on the base 600s
# timeout (sonnet-4-5) and on scuttlerun's default 50 agent turns
# (claude-sonnet-5). Give the rep real headroom on all three per-session
# limits — each still bounds a runaway session.
timeout: 1800
max_turns: 150
max_budget_usd: 10.0

user:
  max_turns: 6
  persona: |
    You want to scaffold a new project and have asked the agent to set it up
    with project standards. When the agent interviews you, answer briefly:
      - Which profiles to enable: choose `base` (and `cli` if it is offered,
        since this is a command-line tool).
      - Whether to disable any standards: no, keep them all.
    Do NOT volunteer a project description, language, runtime version, license
    choice, status, or visibility, and answer only what is asked. Let the agent
    create the files; the task is done once it has generated project.yaml and
    the initial standard files.
