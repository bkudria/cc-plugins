    README.md: |
      # widgetctl

      A tiny CLI for managing widgets.

      ## Installation

      Install with `pip install widgetctl`.

      ## Usage

      `widgetctl --output json`

      ## Configuration

      widgetctl reads each setting from exactly one source. No setting is
      accepted from more than one place, so there is no precedence to resolve
      between sources:

      | Setting         | Source                                                   |
      |-----------------|----------------------------------------------------------|
      | output format   | `--output` flag only                                     |
      | log level       | `WIDGETCTL_LOG_LEVEL` environment variable only          |
      | cache directory | `cache_dir` in `~/.config/widgetctl/config.toml` only    |
    widgetctl/cli.py: |
      """widgetctl — each setting comes from exactly one configuration source."""
      import argparse
      import os
      import tomllib
      from pathlib import Path


      def load_config() -> dict:
          path = Path.home() / ".config" / "widgetctl" / "config.toml"
          if path.exists():
              with path.open("rb") as f:
                  return tomllib.load(f)
          return {}


      def main() -> None:
          parser = argparse.ArgumentParser(prog="widgetctl")
          # --output is the ONLY setting accepted as a flag.
          parser.add_argument("--output", choices=["text", "json"], default="text")
          args = parser.parse_args()

          # WIDGETCTL_LOG_LEVEL is the ONLY setting read from the environment.
          log_level = os.environ.get("WIDGETCTL_LOG_LEVEL", "info")

          # cache_dir is the ONLY setting read from the config file.
          cache_dir = load_config().get("cache_dir", str(Path.home() / ".cache" / "widgetctl"))

          print(f"output={args.output} log_level={log_level} cache_dir={cache_dir}")


      if __name__ == "__main__":
          main()
    config.sample.toml: |
      # Example ~/.config/widgetctl/config.toml
      # The config file supplies exactly one setting: the cache directory.
      cache_dir = "/var/cache/widgetctl"
