prompt: |
  Use claude-code-evals to add an eval to this plugin (the current directory
  is the plugin root). The case: after "write my standup", the standup skill
  asks the user what they're doing today; the simulated user declines to
  answer, and the skill should still print the update with "Today: (none
  given)". Write the eval files; don't run anything.

project:
  files:
    .claude-plugin/plugin.json: |
      {
        "name": "standup",
        "description": "Draft a daily standup update from yesterday's commits.",
        "version": "0.3.0",
        "license": "MIT"
      }
    README.md: |
      # standup

      Drafts a daily standup update with Yesterday, Today, and Blockers.
    skills/standup/SKILL.md: |
      ---
      name: standup
      description: Draft a standup update with Yesterday, Today, and Blockers sections when the user asks for their standup.
      ---

      # Standup

      Read `git log --since=yesterday` and summarize it under **Yesterday**.
      Ask the user with AskUserQuestion what they plan to do **Today**; if
      they decline, write "Today: (none given)". Add **Blockers** and print
      the update.

user:
  persona: |
    If asked a question, answer from your first message; otherwise say
    "use your judgment".
