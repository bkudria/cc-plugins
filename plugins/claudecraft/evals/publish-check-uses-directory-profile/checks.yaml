      check: "The agent's final message links or names the official plugin pre-submission checklist (claude.com/docs/plugins/pre-submission-checklist) as covering checks the CLI does not run"
      note: "skills/plugincraft — the directory runs a safety scan and policy review beyond the CLI; plugincraft points to the official checklist for those."
