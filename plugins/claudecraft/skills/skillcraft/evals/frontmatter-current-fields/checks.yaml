context: |
  The agent was asked to edit the frontmatter of a fixture skill at
  skills/report-gen/SKILL.md so that it runs at high effort, auto-loads only
  for files under src/, and can never call AskUserQuestion. Claude Code's
  documented frontmatter fields for these are `effort`, `paths`, and
  `disallowed-tools`. `allowed-tools` pre-approves tools without a permission
  prompt; it does not restrict which tools are available.
checks:
