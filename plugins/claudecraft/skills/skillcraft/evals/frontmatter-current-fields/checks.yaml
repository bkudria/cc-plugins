      check: "The final SKILL.md frontmatter contains `effort: high`"
  - paths-src:
      check: "The final SKILL.md frontmatter contains a `paths` field whose value matches files under src/ (e.g. `src/**`)"
  - disallowed-ask:
      check: "The final SKILL.md frontmatter contains a `disallowed-tools` field that lists AskUserQuestion"
  - no-allowed-tools-for-restriction:
      check: "The final SKILL.md frontmatter does not contain an `allowed-tools` field"
      note: "Listing every tool except AskUserQuestion under allowed-tools is the misreading the reference fix targets; nothing in the request calls for pre-approving tools"
  - body-unchanged:
      check: "The final SKILL.md still contains the three numbered Steps from the original file with their original wording"
      note: "Regression baseline: the request said to keep everything else as is"
