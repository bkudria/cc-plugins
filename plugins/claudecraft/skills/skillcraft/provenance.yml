# Maps each curated file to its upstream source(s) and curation decision.
#
# Decision taxonomy:
#   kept        - Taken as-is (formatting changes only)
#   simplified  - Reduced complexity while preserving meaning
#   elided      - Intentionally excluded (rationale required)
#   altered     - Changed in meaning or approach from source
#   synthesized - Combined from multiple sources into something new
#   original    - Not derived from any upstream source
curation_decisions:
  # ── Root files ──────────────────────────────────────────────────
  SKILL.md:
    - decision: original
      rationale: Original router-pattern entry point. Not derived from any upstream source.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Description rewritten to be
        location-agnostic (covers personal ~/.claude/skills/, plugin install dir,
        and project-local .claude/skills/). Dependencies section: removed
        advanced-ask, interactive-tmux, gum, fzf (advanced-ask call sites rewritten;
        gum/fzf/interactive-tmux were transitive through advanced-ask). Added
        claude-code-evals as a sibling-in-plugin dep and gh as a direct dep. Scripts
        Quick Pre-flight code block updated to use ${CLAUDE_SKILL_DIR} for self-references.
  # ── Reference files ──────────────────────────────────────────────
  references/official-spec.md:
    - source: official-docs
      sections: ["*"]
      decision: simplified
      rationale: >-
        Kept all spec content. Trimmed visualization walkthrough example and troubleshooting section for brevity. Added --add-dir section, skill access restriction section, updated budget description (2026-02-24).
        Added bundled skills section and ${CLAUDE_SKILL_DIR} substitution (2026-03-05).
  references/frontmatter-reference.md:
    - source: official-docs
      sections: [frontmatter-reference, string-substitutions]
      decision: kept
      rationale: >-
        Core field table and substitutions from official docs. Added user-invocable clarification (2026-02-24).
    - source: anthropic-skills
      sections: [SKILL.md#progressive-disclosure]
      decision: synthesized
      rationale: Progressive disclosure strategy guidance.
    - source: compound-engineering
      sections: [references/official-spec.md, references/skill-structure.md]
      decision: synthesized
      rationale: Added trade-off notes and common field combinations.
  references/writing-style.md:
    - source: anthropic-skills
      sections: [SKILL.md#writing-guidelines]
      decision: altered
      rationale: >-
        Expanded from terse 'use imperative/infinitive form' into comprehensive style guide with voice/tone table, formatting rules, code example requirements, and content length guidelines.
    - source: compound-engineering
      sections: [references/be-clear-and-direct.md]
      decision: synthesized
      rationale: Voice/tone rules and common mistakes table.
    - source: pcvelz-superpowers
      sections: [Code-Examples, Token-Efficiency]
      decision: synthesized
      rationale: >-
        Added "one excellent example beats many" philosophy to code examples section.
        Replaced line-based content length targets with word-based targets matching
        CSO token efficiency guidance.
  references/naming-conventions.md:
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Swapped example skill names
        in the naming-patterns and exemplar-descriptions tables: removed advanced-ask
        and interactive-tmux references (the skill is being deleted from
        ~/.claude/skills/); replaced with claude-code-evals and other current skills.
    - source: official-docs
      sections: [frontmatter-reference#name]
      decision: kept
      rationale: Name format rules (hyphen-case, 64 char max) from official spec.
    - source: compound-engineering
      sections: [SKILL.md#effective-descriptions, references/best-practices.md]
      decision: synthesized
      rationale: Description construction pattern and trigger phrase design.
    - source: pcvelz-superpowers
      sections: [CSO, Token-Efficiency, Discovery-Workflow]
      decision: synthesized
      rationale: >-
        Added Claude Search Optimization (CSO) section: description pitfall finding,
        keyword coverage strategies, word-based token efficiency targets, compression
        techniques, and discovery workflow. Descriptive naming guidance.
    - source: anthropic-skills
      sections: [skills/skill-creator/SKILL.md#description-optimization]
      decision: synthesized
      rationale: >-
        Added description trigger testing section with eval query design guidance from
        Anthropic's description optimization workflow. Kept query design principles,
        elided Python tooling (2026-03-05).
  references/skill-templates.md:
    - decision: original
      rationale: >-
        Templates are original. Inspired by compound-engineering templates but fully rewritten as generic skill-type starters (knowledge, workflow, tool, hybrid).
    - source: pcvelz-superpowers
      sections: [Skill-Types]
      decision: synthesized
      rationale: >-
        Added Technique, Pattern, and Reference skill types from writing-skills
        taxonomy. Added type comparison table. Original 4 types unchanged.
  references/interactive-tui.md:
    - decision: original
      rationale: >-
        Original content based on our interactive-tmux and gum skills.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Full rewrite from 122 lines
        to ~65 lines covering AskUserQuestion + conversational chat patterns.
        Removed all guidance for advanced-ask, ask-file.sh/ask-choose.sh/ask-form.sh,
        gum subcommands, and interactive-tmux. The reference is now mechanism-agnostic
        in spirit (covers the two built-in mechanisms only).
  references/dependencies.md:
    - decision: original
      rationale: >-
        Original content. Some dependency concepts from anthropic-skills but fully rewritten.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Replaced advanced-ask /
        interactive-tmux examples (the skills are being deleted) with current
        examples: jq/yq/gh for external CLIs, claude-code-evals/skillcraft for
        skill-to-skill. Added the Workflow-GATE composition pattern (matches how
        claudecraft's two skills interact in practice). Path-resolution section
        now teaches ${CLAUDE_SKILL_DIR} for self-references and name-based
        references for other skills, rather than hard-coded absolute paths.
  references/resource-usage.md:
    - source: anthropic-skills
      sections: [SKILL.md#bundled-resources]
      decision: altered
      rationale: Restructured and expanded resource type guidance.
  references/dynamic-context.md:
    - source: official-docs
      sections: [dynamic-context-injection, string-substitutions]
      decision: synthesized
      rationale: >-
        Backtick-bang syntax and string substitutions from official docs. Corrected 2026-02-24: backtick-bang works in body text, not in a context frontmatter array. Removed incorrect context-array pattern.
    - source: compound-engineering
      sections: [SKILL.md#dynamic-features]
      decision: synthesized
      rationale: Use case patterns and best practices.
  references/anti-patterns.md:
    - source: compound-engineering
      sections: [SKILL.md#anti-patterns, references/best-practices.md]
      decision: altered
      rationale: >-
        Expanded from brief list to named anti-patterns with before/after fixes.
    - source: anthropic-plugin
      sections: [references/eval-mode.md]
      decision: synthesized
      rationale: Iteration patterns for skill quality.
    - source: pcvelz-superpowers
      sections: [Anti-Patterns, CSO]
      decision: synthesized
      rationale: >-
        Added 5 new anti-patterns (Narrative Example, Multi-Language Dilution,
        Workflow Summary Description, Code in Flowcharts, Generic Labels).
        Reorganized all 15 into 4 categories (Structural, Content, Naming &
        Discovery, Examples & Formatting).
  references/bulletproofing.md:
    - source: pcvelz-superpowers
      sections: [Bulletproofing, Persuasion-Principles, RED-GREEN-REFACTOR]
      decision: synthesized
      rationale: >-
        Synthesized from writing-skills rationalization resistance techniques,
        persuasion principles (Cialdini 2021, Meincke 2025), loophole closing
        patterns, and red flags list approach. Adapted to skillcraft's structure.
  references/common-fixes.md:
    - decision: original
      rationale: Concrete fix cookbook built from checklist failure patterns.
  references/quality-checklist.md:
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). C7 Dependencies-Documented
        check example list updated: replaced `gum` with `yq`/`gh` since skillcraft
        no longer uses gum.
    - source: compound-engineering
      sections: [SKILL.md#audit-checklist]
      decision: altered
      rationale: Expanded from ~10 items to 32 checks across 6 categories.
    - source: anthropic-plugin
      sections: [references/schemas.md]
      decision: synthesized
      rationale: Added advanced feature checks (A1-A5).
    - source: pcvelz-superpowers
      sections: [Skill-Creation-Checklist]
      decision: synthesized
      rationale: >-
        Added T1-T5 TDD Compliance category (baseline tested, rationalizations
        captured, compliance verified, loopholes closed, skill type testing).
        Total now 42 checks across 8 categories (added E1-E5 eval pipeline category).
  references/source-integration.md:
    - decision: original
      rationale: Templates and frameworks for source integration workflow.
  references/router-pattern.md:
    - decision: original
      rationale: Original architecture guidance for when/how to upgrade to router pattern.
  references/testing-guide.md:
    - decision: original
      rationale: Original testing framework covering 6 testing areas.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). § 5 Interactive Element
        Testing rewritten to cover AskUserQuestion + conversational chat instead
        of gum/fzf/interactive-tmux/form-based prompts. Missing-dependency example
        updated from `gum` to `jq`/`yq`.
    - source: pcvelz-superpowers
      sections: [TDD-Mapping, Iron-Law, Testing-All-Skill-Types, Common-Rationalizations]
      decision: synthesized
      rationale: >-
        Added TDD Iron Law, testing-by-skill-type
        (discipline/technique/pattern/reference), and rationalization table. Original
        6 testing areas preserved intact.
  # ── Workflow files (all original) ────────────────────────────────
  workflows/create-phase1-discovery.md:
    - decision: original
      rationale: Original interview-driven discovery process.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Step 3 rewritten: replaced
        the ask-form.sh four-field TUI form with conversational batched questions
        for name/purpose/triggers plus an AskUserQuestion call for the binary
        location field.
  workflows/create-phase2-implement.md:
    - decision: original
      rationale: Phase 2 of the 4-phase Create workflow — authoring the skill (SKILL.md, references, scripts). Replaced earlier phase2-design and phase4-author when the create path was consolidated from 6 phases to 4.
  workflows/create-phase3-validate.md:
    - decision: original
      rationale: Phase 3 of the 4-phase Create workflow — validating the skill via quality-checklist.md and quick-validate.sh. Replaced earlier phase3-scaffold and phase5-validate when the create path was consolidated from 6 phases to 4.
  workflows/create-phase4-refine.md:
    - decision: original
      rationale: Phase 4 of the 4-phase Create workflow — iterating based on eval results and validation feedback. Replaced earlier phase6-eval when the create path was consolidated from 6 phases to 4.
  workflows/create-domain-expertise.md:
    - decision: original
      rationale: Original alternative path for broad domain skills.
  workflows/improve-standard.md:
    - decision: original
      rationale: Original 6-step audit workflow.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Step 1 (skill picker)
        rewritten from ask-file.sh to AskUserQuestion-with-top-candidates +
        conversational fallback. Step 5 (per-issue action) rewritten from
        ask-choose.sh to AskUserQuestion (3 options fit native limit). Quick
        Pre-flight code block uses ${CLAUDE_SKILL_DIR}.
  workflows/improve-bulk.md:
    - decision: original
      rationale: Original bulk audit with summary table.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Example summary table
        updated: replaced `gum` and `advanced-ask` rows (those skills being
        deleted) with `claude-code-evals` and `skillcraft`.
  workflows/update-from-sources.md:
    - decision: original
      rationale: Self-update mechanism. Not derived from any source.
  workflows/integrate-source.md:
    - decision: original
      rationale: Workflow for folding content from external sources into existing skills.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Phase 3 instruction
        changed from "Use AskUserQuestion or the advanced-ask skill" to
        "Use AskUserQuestion; fall back to conversational chat when 4-option
        limit is exceeded". Phase 6 validation bash blocks use ${CLAUDE_SKILL_DIR}
        for self-references.
  workflows/add-provenance.md:
    - decision: original
      rationale: Workflow for adding provenance tracking to existing skills.
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Step 1 (target-skill
        selection) rewritten from ask-file.sh to AskUserQuestion-with-top-candidates
        + conversational fallback. Step 7 validation bash block uses ${CLAUDE_SKILL_DIR}.
  # ── Scripts (all original) ──────────────────────────────────────
  scripts/scaffold.sh:
    - decision: original
      rationale: Original scaffolding script.
    - decision: altered
      rationale: >-
        2026-05-21: --evals delegates to `craboodle init` instead of writing
        evals/craboodle.yaml + evals/base.yaml inline. Source of truth for the
        evals.yaml template now lives in craboodle itself (src/commands/init.ts).
  scripts/quick-validate.sh:
    - decision: original
      rationale: Original structural validation script.
  scripts/post-integration-check.sh:
    - decision: original
      rationale: Post-integration content quality validation script.
  scripts/check-upstream.sh:
    - decision: original
      rationale: Original upstream source checking script.
  # ── Eval pipeline files (original, inspired by Anthropic skill-creator) ──
  references/eval-guide.md:
    - source: anthropic-skills
      sections: [skills/skill-creator/SKILL.md]
      decision: synthesized
      rationale: >-
        Slimmed to skill-specific eval patterns only (by-skill-type tables, worked
        examples, trigger testing). Generic eval mechanics (scenario schema, check
        design, results interpretation) deferred to the claude-code-evals skill.
  workflows/bootstrap-evals.md:
    - source: anthropic-skills
      sections: [skills/skill-creator/SKILL.md]
      decision: synthesized
      rationale: >-
        Eval-bootstrap workflow synthesized from Anthropic's skill-creator eval pipeline design,
        adapted for skillcraft's craboodle/pincenez/scuttlerun toolchain. Replaced the earlier
        create-phase6-eval.md when evals became a separate workflow (callable for existing
        skills, not just during Create).
    - decision: altered
      rationale: >-
        Packaged into claudecraft plugin (2026-05-19). Step 1 (target-skill
        selection) rewritten from ask-file.sh to AskUserQuestion-with-top-candidates
        + conversational fallback. Step 2 format-reference advice updated:
        dropped the `~/.claude/skills/skillcraft/evals/` example path (that
        directory does not exist) and now points to the sibling claude-code-evals
        skill in the same plugin.
    - decision: altered
      rationale: >-
        2026-05-21: Rewrote Step 5 for the single-file evals.yaml layout
        (scenarios.base instead of separate craboodle.yaml + base.yaml).
        Brought it in sync with craboodle's actual config schema (src/config.ts)
        and with the description in claude-code-evals/references/scenario-design.md.
