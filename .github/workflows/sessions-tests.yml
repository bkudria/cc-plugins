name: sessions-tests

on:
  pull_request:
    paths:
      - 'plugins/sessions/**'
      - '.github/workflows/sessions-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/sessions/**'
      - '.github/workflows/sessions-tests.yml'

permissions:
  contents: read

env:
  SCRUT_VERSION: v0.5.0
  SCRUT_SHA256: 033c6a5ebf189f85169a8f4095ef26a5a9d023ceabb20454c1a48f00b2f2a509
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # cc-sessions supports both the Homebrew jq and the jq that ships with macOS.
        jq: [homebrew, system]
    name: test (jq ${{ matrix.jq }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq, ripgrep and shellcheck
        run: brew install jq ripgrep shellcheck

      - name: Install scrut
        run: |
          set -euo pipefail
          archive="scrut-$SCRUT_VERSION-macos-aarch64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/facebookincubator/scrut/releases/download/$SCRUT_VERSION/$archive"
          echo "$SCRUT_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/scrut-macos-aarch64/scrut" "$RUNNER_TEMP/bin/scrut"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Put the system jq first on PATH
        if: matrix.jq == 'system'
        run: |
          set -euo pipefail
          test -x /usr/bin/jq || { echo "::error::/usr/bin/jq is missing on this runner"; exit 1; }
          mkdir -p "$RUNNER_TEMP/system-jq"
          ln -s /usr/bin/jq "$RUNNER_TEMP/system-jq/jq"
          echo "$RUNNER_TEMP/system-jq" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          command -v jq && jq --version
          rg --version | head -1
          shellcheck --version | sed -n 2p
          scrut --version

      - name: Run the scrut suite
        run: scrut test plugins/sessions/tests
