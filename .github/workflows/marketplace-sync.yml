name: marketplace-sync

on:
  pull_request:
    paths:
      - 'plugins/**/.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'plugins/claudecraft/skills/plugincraft/scripts/marketplace-generate.sh'
      - '.github/workflows/marketplace-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/**/.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip fork PRs — they can't receive pushed commits
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout PR head (pull_request only)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Use the head ref as a git argument; bash quoting prevents injection.
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Regenerate marketplace.json
        id: regen
        run: |
          ./plugins/claudecraft/skills/plugincraft/scripts/marketplace-generate.sh
          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "marketplace.json already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "marketplace.json was regenerated; diff follows:"
            git --no-pager diff -- .claude-plugin/marketplace.json
          fi

      - name: Commit and push
        if: steps.regen.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/marketplace.json
          git commit -m "chore(marketplace): auto-regenerate marketplace.json

          Triggered by marketplace-sync workflow. Source of truth: each
          plugin's plugin.json. See plugincraft/references/marketplace-spec.md
          for what the generator rewrites vs preserves."
          git push
